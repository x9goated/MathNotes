# XcodeGen spec for the cloud build (GitHub Actions).
# The Swift sources live in MathNotes.swiftpm/App so the app still opens in Swift Playgrounds.
name: MathNotes
options:
  deploymentTarget:
    iOS: "17.0"
targets:
  MathNotes:
    type: application
    platform: iOS
    sources:
      - path: MathNotes.swiftpm/App
    settings:
      base:
        PRODUCT_NAME: MathNotes
        # Keep in sync with Package.swift. Must be unique for a free Apple ID.
        PRODUCT_BUNDLE_IDENTIFIER: com.mathnotes.ipad.q4t8
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "2"
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: MathNotes
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.education
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: "YES"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
schemes:
  MathNotes:
    build:
      targets:
        MathNotes: all
    archive:
      config: Release
